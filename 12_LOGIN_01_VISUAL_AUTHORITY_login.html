<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Portal DMO</title><link rel="stylesheet" href="0_ASSET_CANONICAL_DESIGN_SYSTEM.css"><link rel="stylesheet" href="0_ASSET_SHELL.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:28px}.login-shell{width:min(1120px,100%);min-height:650px;display:grid;grid-template-columns:38% 62%;overflow:hidden}.identity{position:relative;padding:50px 44px;background:linear-gradient(155deg,var(--dmo-brand-050),#c7d9eb);display:flex;flex-direction:column}.brand-logo{width:78px;height:78px;border-radius:50%;object-fit:cover;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.14em;color:var(--dmo-brand-600)}.identity h1{margin:8px 0 4px;font-size:32px;color:var(--dmo-brand-950)}.identity p{margin:0;color:var(--dmo-brand-800)}.identity-foot{margin-top:auto;color:var(--dmo-muted);font-size:11px}.identity-foot strong{display:block;margin-top:12px;color:var(--dmo-brand-700)}.login-side{display:flex;align-items:center;justify-content:center;padding:58px}.login-form{width:min(410px,100%)}.login-form h2{font-size:28px;margin:0 0 6px}.login-form>.lead{margin:0 0 18px;color:var(--dmo-muted)}.login-form .dmo-field{margin-bottom:15px}.password-wrap{position:relative;display:flex;align-items:center}.password-wrap input{padding-right:105px}.password-wrap .password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:auto;min-width:82px;min-height:30px;height:calc(100% - 10px);padding:4px 10px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.submit{width:100%;min-height:44px;margin-top:4px}.form-message{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--dmo-danger-soft);color:var(--dmo-danger);font-size:12px}.form-message.show{display:block}
@media(max-width:760px){body{padding:0}.login-shell{min-height:100vh;grid-template-columns:1fr;border:0;border-radius:0}.identity{padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.brand-logo{width:56px;height:56px;margin:0}.identity .copy h1{font-size:22px;margin:2px 0}.identity .copy p,.identity-foot{display:none}.login-side{padding:36px 24px;align-items:start}}
</style><link rel="stylesheet" href="beta-adapter.css">
<script src="beta-session.js" defer></script></head><body data-beta-page="login"><main class="login-shell dmo-card"><section class="identity"><img class="brand-logo" src="0_ASSET_LOGO.png" alt="BA Glass"><div class="copy"><div class="eyebrow">BA GLASS</div><h1>Portal DMO</h1><p>Aplicações do Departamento DMO</p></div><div class="identity-foot">Acesso reservado a utilizadores autorizados.<strong>Portal DMO · Desenvolvido por Diogo Oliveira · 2026</strong></div></section><section class="login-side"><form class="login-form" id="loginForm"><h2>Entrar</h2><p class="lead">Introduza as suas credenciais para aceder ao Portal DMO.</p><div class="dmo-field"><label for="email">Utilizador</label><input id="email" type="email" autocomplete="username" placeholder="nome@empresa.com" required></div><div class="dmo-field"><label for="password">Palavra-passe</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button class="dmo-button password-toggle" id="passwordToggle" type="button">Mostrar</button></div></div><button class="dmo-button submit" id="submitButton">Entrar</button><div class="form-message" id="formMessage" role="alert">Preencha o email e a palavra-passe.</div></form></section></main><script>
const password=document.querySelector('#password'),email=document.querySelector('#email'),toggle=document.querySelector('#passwordToggle'),form=document.querySelector('#loginForm'),submit=document.querySelector('#submitButton'),message=document.querySelector('#formMessage');toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'Ocultar':'Mostrar'};form.onsubmit=e=>{e.preventDefault();if(!form.checkValidity()){message.classList.add('show');return}message.classList.remove('show');submit.disabled=true;submit.textContent='A entrar…';setTimeout(()=>{submit.disabled=false;submit.textContent='Entrar';location.href=email.value.toLowerCase().includes('admin')?'13_ADMIN_01_VISUAL_AUTHORITY_admin.html':'20_JOB_ON_01_VISUAL_AUTHORITY_job-on.html'},700)};
</script><script src="beta-adapter.js" defer></script>
</body></html>
