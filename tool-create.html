<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar ferramenta — DMO Beta</title><link rel="stylesheet" href="0_ASSET_CANONICAL_DESIGN_SYSTEM.css"><link rel="stylesheet" href="0_ASSET_SHELL.css"><link rel="stylesheet" href="beta-adapter.css?v=tool-20260924"><link rel="stylesheet" href="beta-shell.css"><script src="beta-session.js" defer></script><script src="beta-shell.js" defer></script></head>
<body>
<header class="dmo-shell-header" data-shell-module="Ferramentas" data-shell-user="Diogo Oliveira" data-shell-role="Metrologia"></header>
<nav class="dmo-primary-nav"><a href="20_JOB_ON_01_VISUAL_AUTHORITY_job-on.html">Planeamento</a><a href="22_PESO_OPERADOR_01_VISUAL_AUTHORITY_peso-operador.html">Controlo</a><a href="31_BOQUILHAS_01_VISUAL_AUTHORITY_boquilhas.html">Boquilhas</a></nav>
<main class="beta-tool-form"><section class="beta-form-card"><header class="beta-form-head"><div><h2>Nova ferramenta</h2><p>Registe a ferramenta para a associar à produção no Job On.</p></div></header>
<form id="toolForm"><div class="beta-tool-grid"><div class="dmo-field"><label for="toolType">Tipo</label><select id="toolType" required><option value="">Selecionar</option><option>CM</option><option>MF</option><option>BQ</option></select></div><div class="dmo-field"><label for="toolReference">Referência da ferramenta</label><input id="toolReference" required placeholder="Ex.: T132, 5447 ou 9389"></div><div class="dmo-field"><label for="toolLot">Lote</label><input id="toolLot" required placeholder="Ex.: 04"></div><div class="dmo-field"><label for="toolProcess">Processo</label><select id="toolProcess"><option value="">Não aplicável</option><option>NNPB</option><option>PS</option><option>PB</option><option>BB</option></select></div><div class="dmo-field"><label for="toolQuantity">Quantidade</label><input id="toolQuantity" type="number" min="0" placeholder="Ex.: 16"></div><div class="dmo-field"><label for="toolUsage">Utilização (%)</label><input id="toolUsage" type="number" min="0" max="100" step="0.01" value="0" required></div><div class="dmo-field wide"><label>Máquinas / linhas compatíveis</label><div class="beta-machine-grid"><label class="beta-machine-choice"><input type="checkbox" value="B1">B1</label><label class="beta-machine-choice"><input type="checkbox" value="B2">B2</label><label class="beta-machine-choice"><input type="checkbox" value="B3" checked>B3</label><label class="beta-machine-choice"><input type="checkbox" value="C1">C1</label><label class="beta-machine-choice"><input type="checkbox" value="C2">C2</label><label class="beta-machine-choice"><input type="checkbox" value="C3">C3</label></div></div><div class="dmo-field"><label for="toolNotes">Observações</label><input id="toolNotes" placeholder="Informação adicional"></div></div><div class="beta-form-actions"><a class="dmo-button" href="20_JOB_ON_01_VISUAL_AUTHORITY_job-on.html">Cancelar</a><button class="dmo-button" type="submit">Criar e selecionar ferramenta</button></div></form></section></main>
<script>const params=new URLSearchParams(location.search),origins={jobon:'20_JOB_ON_01_VISUAL_AUTHORITY_job-on.html','controlo-create':'22_PESO_OPERADOR_01_VISUAL_AUTHORITY_peso-operador.html','controlo-hub':'21_CONTROLO_01_VISUAL_AUTHORITY_controlo.html',boquilhas:'31_BOQUILHAS_01_VISUAL_AUTHORITY_boquilhas.html'},returnTo=origins[params.get('from')]||origins.jobon;document.querySelectorAll('.beta-form-actions a').forEach(a=>a.href=returnTo);if(['CM','MF','BQ'].includes(params.get('type')))document.querySelector('#toolType').value=params.get('type');document.querySelector('#toolReference').value=params.get('reference')||'';if(params.get('lot'))document.querySelector('#toolLot').value=params.get('lot');if(params.get('quantity'))document.querySelector('#toolQuantity').value=params.get('quantity');if(params.get('usage'))document.querySelector('#toolUsage').value=params.get('usage');if(params.get('line'))document.querySelectorAll('.beta-machine-choice input').forEach(input=>input.checked=input.value===params.get('line')); const detail=params.get('mode')==='detail';if(!detail&&params.get('from')!=='jobon'){location.replace(origins.jobon)}if(detail){document.title='Ficha da ferramenta — DMO Beta';document.querySelector('.beta-form-head h2').textContent='Boquilha existente';document.querySelector('.beta-form-head p').textContent='Dados da identidade da ferramenta selecionada.';document.querySelector('.beta-form-actions button').remove();document.querySelectorAll('#toolForm input,#toolForm select,#toolForm textarea').forEach(field=>field.disabled=true);document.querySelector('#toolUsage').value=params.get('usage')||'0'}document.querySelector('#toolForm').onsubmit=e=>{e.preventDefault();const type=document.querySelector('#toolType').value,reference=document.querySelector('#toolReference').value.trim().toUpperCase(),lot=document.querySelector('#toolLot').value.trim();if(!type||!reference||!lot){alert('Preencha Tipo, Referência e Lote.');return}if(!detail){const tool={toolId:`DEMO-TOOL-${crypto.randomUUID?.()||Date.now()}`,type,reference,lot,process:document.querySelector('#toolProcess').value||'—',quantity:(document.querySelector('#toolQuantity').value||'—')+' peças',usage:Number(document.querySelector('#toolUsage').value),machines:[...document.querySelectorAll('.beta-machine-choice input:checked')].map(input=>input.value).join(' · ')||'—'};let tools=[];try{tools=JSON.parse(sessionStorage.getItem('betaDemoTools')||'[]')}catch(_){}tools.push(tool);sessionStorage.setItem('betaDemoTools',JSON.stringify(tools));sessionStorage.setItem('createdTool',JSON.stringify(tool))}location.href=returnTo+(detail?'':'?toolCreated=1')};</script></body></html>
